# Pin keeps the v0.16 default when the stored value equals it (behaviour is
# preserved); inherit removes the value so the v1 default applies. Values that
# differ from the old default are always kept. "*" applies to every property of
# the schema without an own entry. Old and new defaults are read from the schema
# snapshots. The `changed_defaults` prompt can override every policy.
[defaults."x:Cache"]
"*" = "inherit"
dnsRbl = "inherit"

[defaults."x:DkimReportSettings"]
"*" = "inherit"

[defaults."x:DmarcReportSettings"]
"*" = "inherit"

[defaults."x:DsnReportSettings"]
"*" = "inherit"

[defaults."x:SpfReportSettings"]
"*" = "inherit"

[defaults."x:TlsReportSettings"]
"*" = "inherit"

[defaults."x:MtaStageAuth"]
saslMechanisms = "inherit"

[defaults."x:RocksDbStore"]
blobSize = "inherit"
cacheSize = "inherit"

[defaults."x:MySqlStore"]
poolMaxConnections = "inherit"

[defaults."x:PostgreSqlStore"]
poolMaxConnections = "inherit"

[defaults."x:SqliteStore"]
poolMaxConnections = "inherit"

[defaults."x:NetworkListener"]
maxConnections = "inherit"

[defaults."x:OidcDirectory"]
claimName = "pin"

[defaults."x:RedisClusterStore"]
authUsername = "pin"

[defaults."x:RedisSentinelStore"]
authUsername = "pin"

[defaults."x:Search"]
"*" = "inherit"

[defaults."x:SpamPyzor"]
enable = "pin"

[defaults."x:SqlDirectory"]
queryLogin = "pin"

[defaults."x:TracerLog"]
prefix = "pin"

[defaults."x:NatsCoordinator"]
addresses = "pin"

# New v1 properties, and properties v0.16 computed but v1 stores, without a
# default and without a marker-variant default, with the transform that fills
# them (checked by schema_diff.py --check).
[populated]
"x:AzureStore.auth" = "azure_auth"

# Functions renamed in v1 (crates/common/src/expr/functions/mod.rs in both
# trees). v1 has no side-effect-free counter read: key_get returns nothing for
# a counter entry, and key_incr with a zero delta returns the current value but
# creates the key when it is missing, so that rewrite needs the operator
# (prompt counter_read).
[expression_functions]
counter_incr = "key_incr"
counter_get = { to = "key_incr", append_args = ["0"], prompt = "counter_read" }

# Grants applied by the `permissions` transform when the `new_permissions`
# prompt is answered with `grant`: a role or permission list that enables (or
# disables) any of the listed v0.16 permissions also enables (or disables) the
# new v1 permission.
[permission_grants]
imapMetadataGet = ["imapSelect", "imapExamine"]
imapMetadataSet = ["imapStore"]
imapMetadataPrivate = ["imapStore"]
jmapMetadataGet = ["jmapMailboxGet"]
jmapMetadataSet = ["jmapMailboxUpdate"]
jmapMetadataPrivate = ["jmapMailboxUpdate"]
sysMetadataGet = ["sysImapGet"]
sysMetadataUpdate = ["sysImapUpdate"]
sysOAuthGrantGet = ["sysOAuthClientGet"]
sysOAuthGrantQuery = ["sysOAuthClientQuery"]
sysOAuthGrantDestroy = ["sysOAuthClientDestroy"]
sysIndexQueueStatusGet = ["sysTaskGet"]
sysIndexQueueStatusUpdate = ["sysTaskUpdate"]
sysIndexQueueStatusQuery = ["sysTaskQuery"]
taskShareRevokeCleanup = ["taskAccountMaintenance"]
taskDmarcReportWindow = ["taskDmarcReport"]
taskTlsReportWindow = ["taskTlsReport"]

# Task manager (v1 Tasks redesign): v1 retries
# transient failures until the task succeeds or fails permanently and marks a
# task Stalled after alertAfter attempts, so maxAttempts and totalDeadline have
# no equivalent and alertAfter takes its v1 default; the retry strategy maps
# unchanged. TaskStatusRetry.firstFailedAt is v1-only: the tool sets it to the
# task's createdAt when it copies a Retry task, so no rule is needed here. The
# other v1-only Task fields (TaskDestroyAccount.memberGroupIds, CalendarAlarm*
# targetAccountId and recurrenceId) are server-set and need no rule.
[properties."x:TaskManager"]
maxAttempts = { drop = true }
totalDeadline = { drop = true }

[defaults."x:TaskRetryStrategyBackoff"]
maxDelay = "inherit"

# Stock spam filter tags. v1 imports the spam filter rules only when the store
# holds no SpamRule, so a migrated deployment keeps the tags of the rules release
# it imported under v0.16. Transform spam_tag renames the tags whose stock name
# changed and drops the tags v1 no longer emits; the final run adds every tag of
# `added` (spam filter rules 3.0.3) that the migrated settings lack, with its
# stock score. Existing tags keep their scores.
[spam_tags]
renamed = { DISPOSABLE_REPLYTO = "DISPOSABLE_REPLY_TO" }
removed_prefixes = ["LLM_"]

