# Stalwart v0.16.27 -> v1.0 registry mapping.
#
# Curated by hand. `scripts/schema_diff.py candidates` proposes entries for new
# schema differences and `scripts/schema_diff.py --check` fails when a removed
# object, variant, property, enum value, type change or changed default has no
# entry here. The same file drives the Rust engine (crates/mapping) and the
# Python plan converter (cli-plan/convert_plan.py).
#
# Keys are compiled schema names: objects, unions and property schemas use the
# `x:` prefix, enums do not. Property schemas are the flattened schemas of the
# compiled JSON (one entry per DnsServer provider, for example).
#
# Rule forms:
#   old = "new"                                  rename
#   old = { to = "new", convert = "..." }        rename with a value conversion
#   old = { convert = "..." }                    keep the name, convert the value
#   old = { drop = true }                        drop and report
#   old = { move = "x:Schema.property" }         move to another singleton
#   old = { transform = "name", params = {..} }  named transform (both engines)
#   enum value = { to = ["a", "b"] }             one value becomes several (sets)
#
# Conversions: compatible (no value change), string_to_unsigned, scalar_to_set.

version = 1

[objects]
"x:SpamLlm" = { to = "x:SpamAi", transform = "spam_llm_to_ai" }
"x:AiModel" = { transform = "ai_model_union" }
"x:SpamTag" = { transform = "spam_tag" }

[schemas]
"x:AiModel" = "flat v0.16 AiModel, rebuilt as a provider union by transform ai_model_union"
"x:SpamLlmProperties" = "payload of SpamLlm.Enable, rebuilt by transform spam_llm_to_ai"
"x:TaskIndexDocument" = "payload of the dropped Task variant IndexDocument"
"x:TaskIndexTrace" = "payload of the dropped Task variant IndexTrace"

[retired_enums]
IndexDocumentType = "only used by the dropped Task variant IndexDocument"
SearchTracingField = "only used by the dropped property Search.indexTracingFields"
