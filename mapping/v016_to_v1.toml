# Events: the 1:1 moves are code-verified renames; the DKIM and ARC failure
# events were folded into umbrella events (v1 crates/trc/src/event/conv.rs maps
# each mail_auth error to one of them, v0.16 mapped them 1:1). DKIM2 errors were
# reported as Dkim.* events in v0.16 and as Dkim2.* events in v1, so the shared
# names expand to both categories in tracer selections.
