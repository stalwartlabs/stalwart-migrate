# Rules that bring JSON written for any Stalwart 0.16.x release to the 0.16.27
# vocabulary, applied before v016_to_v1.toml. Derived by diffing the compiled
# schema of every v0.16 tag against v0.16.27:
#
#   0.16.0 to 0.16.3   DnsServer and DnsServerBootstrap variant Sig0 (now Deprecated1)
#   0.16.0 to 0.16.15  S3Store.accessKey was a plain string (now PublicStringOptional)
#   0.16.0 to 0.16.19  Locale used POSIX names (en_US, de_DE@euro) instead of BCP 47
#
# The migration tool reads a 0.16.27 server, where these rules never match; the
# CLI plan converter needs them for plans written against older servers.
#
# Rule forms are the same as in v016_to_v1.toml. `[enum_separators]` rewrites a
# value that is not a valid 0.16.27 value by replacing one separator with
# another, and keeps the result only when it is valid.

version = 1

[variants."x:DnsServer"]
Sig0 = "Deprecated1"

[variants."x:DnsServerBootstrap"]
Sig0 = "Deprecated1"

[enums.DnsServerType]
Sig0 = "Deprecated1"

[enums.DnsServerBootstrapType]
Sig0 = "Deprecated1"

[properties."x:S3Store"]
accessKey = { convert = "string_to_public_optional" }

[enum_separators.Locale]
from = "_"
to = "-"

[enums.Locale]
POSIX = "en-US"
"aa_ER@saaho" = "ssy-ER"
"be_BY@latin" = "be-Latn-BY"
